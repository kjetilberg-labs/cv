<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Parchment background -->
  <rect width="32" height="32" fill="#f1ead6"/>
  <!-- Outer border — stamp ink -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#a42d1d" stroke-width="1.5"/>
  <!-- Inner border — stamp ink -->
  <rect x="3.5" y="3.5" width="25" height="25" fill="none" stroke="#a42d1d" stroke-width="0.75"/>
  <!-- Monogram -->
  <text
    x="16.75" y="21"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14"
    font-weight="700"
    text-anchor="middle"
    fill="#a42d1d"
    letter-spacing="1.5"
  >KB</text>
</svg>
